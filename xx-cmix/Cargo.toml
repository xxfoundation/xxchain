[package]
name = "xx-cmix"
version = "0.1.0"
authors = ["Bernardo Cardoso <bernardo@xx.network>"]
edition = "2021"

[dependencies]
# third-party dependencies
codec = { workspace = true }
scale-info = { workspace = true }
serde = { workspace = true }

# primitives
sp-runtime = { workspace = true }
sp-arithmetic = { workspace = true }

# frame dependencies
frame-support = { workspace = true }
frame-system = { workspace = true }

pallet-staking = { workspace = true }
xx-staking-extension = { path = "../xx-staking-extension", default-features = false }

frame-benchmarking = { workspace = true, optional = true }

[dev-dependencies]
sp-core = { workspace = true, default-features = true }
sp-io = { workspace = true, default-features = true }
sp-staking = { workspace = true, default-features = true }
sp-tracing = { workspace = true, default-features = true }

frame-election-provider-support = { workspace = true, default-features = true }
pallet-staking-reward-curve = { workspace = true, default-features = true }

pallet-authorship = { workspace = true, default-features = true }
pallet-timestamp = { workspace = true, default-features = true }
pallet-balances = { workspace = true, default-features = true }
pallet-session = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"scale-info/std",
	"serde/std",
	"sp-runtime/std",
	"sp-arithmetic/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-staking/std",
	"xx-staking-extension/std",
	"frame-benchmarking?/std",
]
runtime-benchmarks = ["frame-benchmarking/runtime-benchmarks"]
try-runtime = [ "frame-support/try-runtime" ]
