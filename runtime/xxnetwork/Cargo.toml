[package]
name = "xxnetwork-runtime"
version = "0.2.6"
authors = ["xxlabs <admin@xx.network>"]
edition = "2021"
build = "build.rs"
homepage = "https://xx.network"
repository = "https://github.com/xx-labs/xxchain/"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# third-party dependencies
codec = { workspace = true }
scale-info = { workspace = true }
static_assertions = { workspace = true }
log = { workspace = true }

# primitives
sp-authority-discovery = { workspace = true }
sp-consensus-babe = { workspace = true }
sp-block-builder = { workspace = true }
sp-inherents = { workspace = true }
sp-offchain = { workspace = true }
sp-io = { workspace = true }
sp-core = { workspace = true }
sp-api = { workspace = true }
sp-runtime = { workspace = true }
sp-staking = { workspace = true }
sp-keyring = { workspace = true, optional = true }
sp-session = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-version = { workspace = true }
sp-npos-elections = { workspace = true }
sp-genesis-builder = { workspace = true }
sp-storage = { workspace = true }

# local primitives
node-primitives = { workspace = true }
runtime-common = { workspace = true }

# frame dependencies
frame-executive = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-system-benchmarking = { workspace = true, optional = true }
frame-election-provider-support = { workspace = true }
frame-system-rpc-runtime-api = { workspace = true }
frame-try-runtime = { workspace = true, optional = true }

# pallets
pallet-authority-discovery = { workspace = true }
pallet-authorship = { workspace = true }
pallet-babe = { workspace = true }
pallet-bags-list = { workspace = true }
pallet-balances = { workspace = true }
pallet-bounties = { workspace = true }
pallet-collective = { workspace = true }
pallet-democracy = { workspace = true }
pallet-election-provider-multi-phase = { workspace = true }
pallet-election-provider-support-benchmarking = { workspace = true, optional = true }
pallet-elections-phragmen = { workspace = true }
pallet-grandpa = { workspace = true }
pallet-im-online = { workspace = true }
pallet-identity = { workspace = true }
pallet-membership = { workspace = true }
pallet-offences = { workspace = true }
pallet-offences-benchmarking = { workspace = true, optional = true }
pallet-proxy = { workspace = true }
pallet-session = { workspace = true, features = ["historical"] }
pallet-session-benchmarking = { workspace = true, optional = true }
pallet-staking = { workspace = true }
pallet-staking-reward-curve = { workspace = true }
pallet-scheduler = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-tips = { workspace = true }
pallet-treasury = { workspace = true }
pallet-utility = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }
pallet-vesting = { workspace = true }
pallet-multisig = { workspace = true }
pallet-assets = { workspace = true }
pallet-recovery = { workspace = true }
pallet-uniques = { workspace = true }
pallet-preimage = { workspace = true }
pallet-child-bounties = { workspace = true }
pallet-nfts = { workspace = true }
pallet-nfts-runtime-api = { workspace = true }

# smart contracts
pallet-revive = { workspace = true }

# bridge hub integration
pallet-bridge-grandpa = { workspace = true }
pallet-bridge-messages = { workspace = true }
bp-runtime = { workspace = true }
bp-header-chain = { workspace = true }
bp-messages = { workspace = true }

# XCM stack (for Bridge Hub integration)
pallet-xcm = { workspace = true }
pallet-message-queue = { workspace = true }
staging-xcm = { workspace = true }
staging-xcm-builder = { workspace = true }
staging-xcm-executor = { workspace = true }
bp-polkadot-core = { workspace = true }
pallet-xcm-bridge-hub = { workspace = true }
bp-xcm-bridge-hub = { workspace = true }

# chainbridge
chainbridge = { workspace = true }
# swap
swap = { workspace = true }

# token claims
claims = { workspace = true }

# xx network pallets
xx-cmix = { workspace = true }
xx-economics = { workspace = true }
xx-public = { workspace = true }
xx-staking-extension = { workspace = true }
xx-team-custody = { workspace = true }

# migrations
migrations = { workspace = true }

[build-dependencies]
substrate-wasm-builder = { workspace = true }

