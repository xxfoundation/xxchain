[package]
name = "migrations"
version = "0.1.0"
authors = ["Bernardo Cardoso <bernardo@xx.network>"]
edition = "2021"

[lints]
workspace = true

[dependencies]
log = { workspace = true }
codec = { workspace = true }

# frame dependencies
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-runtime = { workspace = true }
sp-io = { workspace = true }

# staking
pallet-staking = { workspace = true }

# other pallets needing migrations
pallet-offences = { workspace = true }
pallet-grandpa = { workspace = true }
pallet-im-online = { workspace = true }
pallet-identity = { workspace = true }
pallet-bounties = { workspace = true }
pallet-nfts = { workspace = true }
pallet-session = { workspace = true }

# chainbridge
chainbridge = { workspace = true }

# xx pallets
xx-economics = { workspace = true }
xx-public = { workspace = true }
xx-staking-extension = { workspace = true }

[features]
default = ["std"]
std = [
	"log/std",
	"codec/std",
	"frame-support/std",
	"frame-system/std",
	"sp-runtime/std",
	"sp-io/std",
	"pallet-staking/std",
	"pallet-offences/std",
	"pallet-grandpa/std",
	"pallet-im-online/std",
	"pallet-identity/std",
	"pallet-bounties/std",
	"pallet-nfts/std",
	"pallet-session/std",
	"chainbridge/std",
	"xx-economics/std",
	"xx-public/std",
	"xx-staking-extension/std"
]
try-runtime = [
	"frame-support/try-runtime",
	"sp-runtime/try-runtime",
	"pallet-staking/try-runtime",
	"pallet-offences/try-runtime",
	"pallet-grandpa/try-runtime",
	"pallet-im-online/try-runtime",
	"pallet-identity/try-runtime",
	"pallet-bounties/try-runtime",
	"pallet-nfts/try-runtime",
	"pallet-session/try-runtime",
	"xx-public/try-runtime"
]
