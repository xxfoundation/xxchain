# =============================================================================
# Workspace Lints
# =============================================================================
# Centralized lint configuration for the workspace.
# Individual crates inherit via: [lints] workspace = true
# =============================================================================

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(substrate_runtime)"] }

[workspace.lints.clippy]
all = { level = "allow", priority = 0 }
correctness = { level = "warn", priority = 1 }
complexity = { level = "warn", priority = 1 }
# Allow pragmatic exceptions for macro-generated code
too-many-arguments = "allow"
type_complexity = "allow"
needless-lifetimes = "allow"
