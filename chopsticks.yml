# Chopsticks Configuration for xx network
# Fork xx network mainnet for runtime upgrade testing
#
# Usage:
#   chopsticks --config=chopsticks.yml
#   chopsticks try-runtime --config=chopsticks.yml --runtime=./target/release/wbuild/xxnetwork-runtime/xxnetwork_runtime.wasm --checks=all
#
# For testing against a specific block:
#   chopsticks --config=chopsticks.yml --block=<block_number>

endpoint: wss://rpc.xx.network
port: 9944

# Optional: Mock signatures for testing
mock-signature-host: true

# Runtime log level (0=off, 1=error, 2=warn, 3=info, 4=debug, 5=trace)
runtime-log-level: 3

# Database path for caching state (optional)
# db: ./chopsticks-db

# Process queued messages for XCM testing
process-queued-messages: true
