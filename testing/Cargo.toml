[package]
name = "node-testing"
version = "0.2.0"
authors = ["xxlabs <admin@xx.network>"]
edition = "2021"
homepage = "https://xx.network"
repository = "https://github.com/xx-labs/xxchain/"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true, features = ["std"] }
log = { workspace = true, features = ["std"] }
futures = "0.3.21"
tempfile = "3.1.0"
fs_extra = "1.3.0"

# Substrate client
sc-service = { workspace = true, features = ["rocksdb"] }
sc-client-db = { workspace = true, features = ["rocksdb"] }
sc-client-api = { workspace = true }
sc-consensus = { workspace = true }
sc-executor = { workspace = true }
sc-block-builder = { workspace = true }

# Substrate primitives
sp-keyring = { workspace = true }
sp-core = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
sp-consensus = { workspace = true }
sp-api = { workspace = true, features = ["std"] }
sp-timestamp = { workspace = true }
sp-block-builder = { workspace = true, features = ["std"] }
sp-inherents = { workspace = true, features = ["std"] }
sp-blockchain = { workspace = true }

# FRAME
frame-system = { workspace = true, features = ["std"] }
pallet-transaction-payment = { workspace = true, features = ["std"] }

# Testing
substrate-test-client = { workspace = true }

# Local
node-primitives = { workspace = true, features = ["std"] }
runtime-common = { workspace = true, features = ["std"] }
xxnetwork-runtime = { path = "../runtime/xxnetwork" }
claims = { workspace = true, features = ["std"] }
