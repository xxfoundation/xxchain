[package]
name = "node-executor"
version = "0.2.0"
authors = ["xxlabs <admin@xx.network>"]
edition = "2021"
homepage = "https://xx.network"
repository = "https://github.com/xx-labs/xxchain/"
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true, features = ["std"] }
scale-info = { workspace = true, features = ["std", "derive"] }
node-primitives = { workspace = true, features = ["std"] }
runtime-common = { workspace = true, features = ["std"] }
xxnetwork-runtime = { path = "../runtime/xxnetwork", optional = true }
sc-executor = { workspace = true }
sp-core = { workspace = true, features = ["std"] }
sp-keystore = { workspace = true }
sp-state-machine = { workspace = true }
sp-trie = { workspace = true }
frame-benchmarking = { workspace = true, features = ["std"] }
sp-tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
criterion = "0.5"
frame-support = { workspace = true, features = ["std"] }
frame-system = { workspace = true, features = ["std"] }
# node-testing = { path = "../testing" }  # Temporarily disabled during SDK upgrade
pallet-balances = { workspace = true, features = ["std"] }
pallet-im-online = { workspace = true, features = ["std"] }
pallet-timestamp = { workspace = true, features = ["std"] }
pallet-treasury = { workspace = true, features = ["std"] }
pallet-transaction-payment = { workspace = true, features = ["std"] }
sp-application-crypto = { workspace = true, features = ["std"] }
sp-consensus-babe = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
sp-externalities = { workspace = true }
sp-keyring = { workspace = true }
sp-io = { workspace = true, features = ["std"] }
claims = { workspace = true, features = ["std"] }
wat = "1.0"
futures = "0.3.21"

[features]
default = ["xxnetwork"]
stress-test = []
xxnetwork = ["xxnetwork-runtime"]

[[bench]]
name = "bench"
harness = false
