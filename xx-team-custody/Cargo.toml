[package]
name = "xx-team-custody"
version = "0.1.0"
authors = ["Bernardo Cardoso <bernardo@xx.network>"]
edition = "2021"

[lints]
workspace = true

[dependencies]
# third-party dependencies
codec = { workspace = true }
scale-info = { workspace = true }
serde = { workspace = true, optional = true }

# primitives
sp-runtime = { workspace = true }
sp-arithmetic = { workspace = true }

# frame dependencies
frame-support = { workspace = true }
frame-system = { workspace = true }

pallet-staking = { workspace = true }
pallet-staking-reward-fn = { workspace = true }
pallet-proxy = { workspace = true }

frame-benchmarking = { workspace = true, optional = true }

[dev-dependencies]
sp-core = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }
sp-staking = { workspace = true, features = ["std"] }
sp-tracing = { workspace = true, features = ["std"] }

frame-election-provider-support = { workspace = true, features = ["std"] }
pallet-staking-reward-curve = { workspace = true }

pallet-authorship = { workspace = true, features = ["std"] }
pallet-timestamp = { workspace = true, features = ["std"] }
pallet-balances = { workspace = true, features = ["std"] }
pallet-session = { workspace = true, features = ["std", "historical"] }
pallet-democracy = { workspace = true, features = ["std"] }
pallet-elections-phragmen = { workspace = true, features = ["std"] }
pallet-scheduler = { workspace = true, features = ["std"] }
pallet-preimage = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"scale-info/std",
	"serde",
	"sp-runtime/std",
	"sp-arithmetic/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-staking/std",
	"pallet-staking-reward-fn/std",
	"pallet-proxy/std",
	"frame-benchmarking?/std",
]
runtime-benchmarks = ["frame-benchmarking/runtime-benchmarks", "pallet-staking/runtime-benchmarks"]
try-runtime = ["frame-support/try-runtime", "pallet-staking/try-runtime"]
