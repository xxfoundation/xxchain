[package]
name = "xxnetwork-cli"
version = "0.2.6"
authors = ["xxlabs <admin@xx.network>"]
description = "Substrate based, xxnetwork blockchain node implementation in Rust."
build = "build.rs"
edition = "2021"
default-run = "xxnetwork-chain"
homepage = "https://xx.network"
repository = "https://github.com/xx-labs/xxchain/"
publish = false

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# `wasm-opt` has some problems on linux, see
# https://github.com/rustwasm/wasm-pack/issues/781 etc.
wasm-opt = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "xxnetwork-chain"
path = "bin/main.rs"
required-features = ["cli"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# third-party dependencies
clap = { version = "4.0.9", features = ["derive"], optional = true }
codec = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
jsonrpsee = { version = "0.24", features = ["server"] }
futures = "0.3.21"
hex-literal = "0.4.1"
log = { workspace = true, features = ["std"] }
rand = "0.8"

# primitives
sp-authority-discovery = { workspace = true, features = ["std"] }
sp-consensus-babe = { workspace = true, features = ["std"] }
sp-consensus-grandpa = { workspace = true, features = ["std"] }
sp-api = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
sp-timestamp = { workspace = true }
sp-inherents = { workspace = true, features = ["std"] }
sp-keyring = { workspace = true }
sp-keystore = { workspace = true }
sp-consensus = { workspace = true }
sp-transaction-pool = { workspace = true, features = ["std"] }
sp-block-builder = { workspace = true, features = ["std"] }
sp-offchain = { workspace = true, features = ["std"] }
sp-session = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }

# client dependencies
sc-client-api = { workspace = true }
sc-chain-spec = { workspace = true }
sc-consensus = { workspace = true }
sc-transaction-pool = { workspace = true }
sc-transaction-pool-api = { workspace = true }
sc-network = { workspace = true }
sc-network-common = { workspace = true }
sc-network-sync = { workspace = true }
sc-consensus-slots = { workspace = true }
sc-consensus-babe = { workspace = true }
sc-consensus-grandpa = { workspace = true }
sc-rpc = { workspace = true }
sc-sync-state-rpc = { workspace = true }
sc-basic-authorship = { workspace = true }
sc-service = { workspace = true, default-features = false }
sc-telemetry = { workspace = true }
sc-executor = { workspace = true }
sc-authority-discovery = { workspace = true }
sc-sysinfo = { workspace = true }
sc-offchain = { workspace = true }
sp-state-machine = { workspace = true, features = ["std"] }

# frame dependencies
frame-support = { workspace = true, features = ["std"] }
frame-system = { workspace = true, features = ["std"] }
frame-system-rpc-runtime-api = { workspace = true, features = ["std"] }
frame-benchmarking = { workspace = true, features = ["std"] }
pallet-transaction-payment = { workspace = true, features = ["std"] }
pallet-transaction-payment-rpc-runtime-api = { workspace = true, features = ["std"] }
pallet-im-online = { workspace = true, features = ["std"] }

# node-specific dependencies
xxnetwork-runtime = { path = "../runtime/xxnetwork", optional = true }
node-rpc = { path = "../rpc" }
node-primitives = { workspace = true, features = ["std"] }
node-executor = { path = "../executor" }
runtime-common = { workspace = true, features = ["std"] }

# CLI-specific dependencies
sc-cli = { workspace = true, optional = true }
frame-benchmarking-cli = { workspace = true, optional = true }
node-inspect = { path = "../inspect", optional = true }
# try-runtime-cli temporarily disabled - version conflict with polkadot-stable2509-2
# try-runtime-cli = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
sc-keystore = { workspace = true }
sc-client-db = { workspace = true }
sc-consensus = { workspace = true }
sc-consensus-babe = { workspace = true }
sc-consensus-epochs = { workspace = true }
sc-block-builder = { workspace = true }
sp-tracing = { workspace = true, features = ["std"] }
sp-blockchain = { workspace = true }
futures = "0.3.21"
tempfile = "3.1.0"
assert_cmd = "2.0.2"
nix = { version = "0.27", features = ["signal"] }
serde_json = { workspace = true, features = ["std"] }
regex = "1.6.0"
platforms = "3.0"
soketto = "0.8"
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1.22.0", features = ["macros", "time", "parking_lot"] }
tokio-util = { version = "0.7.4", features = ["compat"] }
wait-timeout = "0.2"
# substrate-rpc-client removed - no longer in polkadot-sdk

[build-dependencies]
clap = { version = "4.0.9", optional = true }
clap_complete = { version = "4.0.2", optional = true }
node-inspect = { path = "../inspect", optional = true }
frame-benchmarking-cli = { workspace = true, optional = true }
substrate-build-script-utils = { workspace = true, optional = true }
# substrate-frame-cli removed - no longer in polkadot-sdk
# try-runtime-cli temporarily disabled - version conflict with polkadot-stable2509-2
sc-cli = { workspace = true, optional = true }
pallet-balances = { workspace = true, features = ["std"] }

[features]
default = ["cli", "xxnetwork"]
cli = [
	"node-inspect",
	"sc-cli",
	"frame-benchmarking-cli",
	"sc-service/rocksdb",
	"clap",
	"clap_complete",
	"substrate-build-script-utils",
]
runtime-benchmarks = [
	"xxnetwork-runtime/runtime-benchmarks",
	"frame-benchmarking-cli/runtime-benchmarks",
]
try-runtime = [
	"xxnetwork-runtime/try-runtime",
	# "try-runtime-cli" temporarily disabled - version conflict
]

xxnetwork = ["xxnetwork-runtime", "node-executor/xxnetwork"]

fast-runtime = [
	"xxnetwork-runtime/fast-runtime",
]
