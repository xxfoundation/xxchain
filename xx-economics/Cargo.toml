[package]
name = "xx-economics"
version = "0.1.0"
authors = ["Bernardo Cardoso <bernardo@xx.network>"]
edition = "2021"

[lints]
workspace = true

[dependencies]
# third-party dependencies
codec = { workspace = true }
scale-info = { workspace = true }
serde = { workspace = true }

# primitives
sp-io = { workspace = true }
sp-tracing = { workspace = true }
sp-runtime = { workspace = true }
sp-arithmetic = { workspace = true }

# frame dependencies
frame-support = { workspace = true }
frame-system = { workspace = true }

pallet-staking = { workspace = true }

pallet-staking-reward-fn = { workspace = true }
pallet-proxy = { workspace = true }

xx-public = { workspace = true }

frame-benchmarking = { workspace = true, optional = true }

[dev-dependencies]
pallet-balances = { workspace = true, default-features = true }
sp-staking = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"scale-info/std",
	"serde/std",
	"sp-runtime/std",
	"sp-arithmetic/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-staking/std",
	"pallet-staking-reward-fn/std",
	"pallet-proxy/std",
	"xx-public/std",
	"frame-benchmarking?/std",
]
runtime-benchmarks = ["frame-benchmarking/runtime-benchmarks", "frame-system/runtime-benchmarks"]
try-runtime = [ "frame-support/try-runtime" ]
